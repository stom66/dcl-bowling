name: test-build

on:
  push:
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dcl

    steps:
      - uses: actions/checkout@v6

      - name: Configure node.js
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: npm install

      - name: npm run build
        run: npm run build
